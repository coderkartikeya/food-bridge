events {}

http {

    upstream web {
        server web:80;
    }

    upstream node_gateway {
        server api-node:4000;
    }

    server {

        listen 80;

        location / {
            proxy_pass http://web;
        }

        location /api/ {
            proxy_pass http://node_gateway;
        }

        location /socket/ {
            proxy_pass http://node_gateway;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

    }
}