spring.application.name=api-spring

# ==========================================
# 1. DATABASE CONNECTION (Environment Driven)
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/foodbridge}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:foodbridge}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:foodbridge}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# 2. HIBERNATE & JPA SETTINGS
# ==========================================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=validate

# ==========================================
# 3. FLYWAY CONFIGURATION
# ==========================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ==========================================
# 4. SERVER & OPENAPI
# ==========================================
server.port=8080
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html


application.security.jwt.secret-key=${JWT_SECRET_KEY:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
application.security.jwt.expiration=900000
application.security.jwt.refresh-token.expiration=604800000

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
