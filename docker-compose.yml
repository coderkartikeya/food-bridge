version: "3.9"

services:
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - web
      - api-node

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # Added target to stop at Node stage instead of Nginx
      target: build
    # Fixed working directory
    working_dir: /app/apps/web
    # Bypassed pnpm filter bug
    command: sh -c "npx vite --host 0.0.0.0 --port 80"
    volumes:
      # Granular sync to protect node_modules
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/public:/app/apps/web/public
      - ./apps/web/index.html:/app/apps/web/index.html
      - ./apps/web/vite.config.ts:/app/apps/web/vite.config.ts
    ports:
      # Maps external 5173 to internal 80 so Vite still works directly
      - "5173:80"
    environment:
      - CHOKIDAR_USEPOLLING=true

  api-node:
    build:
      context: .
      dockerfile: apps/api-node/Dockerfile
      # Added target to stop at build stage
      target: build
    # Fixed working directory
    working_dir: /app/apps/api-node
    # Bypassed pnpm filter bug
    command: sh -c "npx tsx watch src/server.ts"
    volumes:
      # Granular sync to protect node_modules
      - ./apps/api-node/src:/app/apps/api-node/src
    ports:
      - "4000:4000"
    depends_on:
      - api-spring

  api-spring:
    build:
      context: ./apps/api-spring
    expose:
      - "8080"
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/foodbridge
      SPRING_DATASOURCE_USERNAME: foodbridge
      SPRING_DATASOURCE_PASSWORD: foodbridge
    deploy:
      resources:
        limits:
          memory: 1G

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: foodbridge
      POSTGRES_PASSWORD: foodbridge
      POSTGRES_DB: foodbridge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: