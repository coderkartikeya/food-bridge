version: "3.9"

services:
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      web:
        condition: service_started
      api-node:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: build
    working_dir: /app/apps/web
    command: sh -c "npx vite --host 0.0.0.0 --port 80"
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/public:/app/apps/web/public
      - ./apps/web/index.html:/app/apps/web/index.html
      - ./apps/web/vite.config.ts:/app/apps/web/vite.config.ts
    ports:
      - "5173:80"
    environment:
      - CHOKIDAR_USEPOLLING=true

  api-node:
    build:
      context: .
      dockerfile: apps/api-node/Dockerfile
      target: build
    working_dir: /app/apps/api-node
    command: sh -c "npx tsx watch src/server.ts"
    volumes:
      - ./apps/api-node/src:/app/apps/api-node/src
    ports:
      - "4000:4000"
    depends_on:
      api-spring:
        condition: service_started

  api-spring:
    build:
      context: ./apps/api-spring
    ports:
      - "8080:8080"
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:                         
        condition: service_started   
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/foodbridge
      SPRING_DATASOURCE_USERNAME: foodbridge
      SPRING_DATASOURCE_PASSWORD: foodbridge
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_DATA_REDIS_HOST: redis  
      SPRING_DATA_REDIS_PORT: 6379   

  postgres:
    image: postgis/postgis:15-3.4-alpine
    environment:
      POSTGRES_USER: foodbridge
      POSTGRES_PASSWORD: foodbridge
      POSTGRES_DB: foodbridge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodbridge -d foodbridge"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
  redis-insight:
    image: redis/redisinsight:latest
    ports:
      - "8001:5540"
    depends_on:
      - redis
volumes:
  postgres_data:
  redis_data: