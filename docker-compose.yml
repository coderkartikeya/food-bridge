version: "3.9"

services:

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - web
      - api-node

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    working_dir: /app
    command: pnpm dev
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true

  api-node:
    build:
      context: .
      dockerfile: apps/api-node/Dockerfile
    working_dir: /app
    command: pnpm dev
    volumes:
      - ./apps/api-node:/app
      - /app/node_modules
    ports:
      - "4000:4000"
    depends_on:
      - api-spring

  api-spring:
    build:
      context: ./apps/api-spring
    expose:
      - "8080"
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/foodbridge
      SPRING_DATASOURCE_USERNAME: foodbridge
      SPRING_DATASOURCE_PASSWORD: foodbridge

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: foodbridge
      POSTGRES_PASSWORD: foodbridge
      POSTGRES_DB: foodbridge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: