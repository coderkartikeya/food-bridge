services:
  # ==========================================
  # NODE API GATEWAY (Backend)
  # ==========================================
  api-node:
    build:
      context: .
      # Stop at the 'build' stage so we have pnpm and tsx
      target: build 
    
    command: pnpm --filter api run dev
    
    volumes:
      # Sync only the source code to avoid overwriting Linux node_modules
      - ./apps/api-node/src:/app/apps/api-node/src


  # ==========================================
  # REACT FRONTEND (Web)
  # ==========================================
  web:
    build:
      context: .
      # 1. Stop at the 'build' stage (Node) so it doesn't switch to Nginx!
      target: build 
      
    # 2. The Port Magic: Force Vite to run on Port 80 instead of 5173. 
    # This tricks your Nginx Gateway into thinking it's talking to the production build!
    command: pnpm --filter web exec vite --port 80 --host 0.0.0.0
    
    volumes:
      # 3. Granular sync. We sync only the files Vite needs to recompile.
      # If we synced the whole folder, Windows would overwrite the container's 
      # node_modules and break Vite's C++ binaries!
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/public:/app/apps/web/public
      - ./apps/web/index.html:/app/apps/web/index.html
      - ./apps/web/vite.config.ts:/app/apps/web/vite.config.ts